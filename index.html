<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top, #1e1e38, #050505); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
        }
        
        .liquid-glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 24px; 
        }

        /* Corregido: El sidebar ahora empieza fuera de pantalla correctamente */
        .menu-lateral { 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            transform: translateX(-110%); 
            position: fixed; top: 0; left: 0; 
            height: 100%; width: 280px; z-index: 200; 
        }
        .menu-lateral.active { transform: translateX(0); }

        .addon-card { transition: all 0.3s ease; cursor: pointer; }
        .addon-card:hover { transform: translateY(-5px); border-color: #3b82f6; background: rgba(255,255,255,0.05); }

        .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

        .loading-spinner { 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid #3b82f6; 
            border-radius: 50%; width: 30px; height: 30px; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Overlay corregido para no bloquear clics cuando está oculto */
        .overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.6); z-index: 150; 
            backdrop-filter: blur(4px); 
        }
        .overlay.active { display: block; }

        /* Modal con Z-index alto para estar encima de todo */
        #modal-detalle { z-index: 300; }
    </style>
</head>
<body class="max-w-xl mx-auto pb-24 px-4">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="modal-detalle" class="fixed inset-0 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="liquid-glass w-full max-w-sm p-6 relative bg-[#0f0f1a]">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-xl text-gray-400 hover:text-white">✕</button>
            <img id="modal-img" src="" class="w-full h-48 object-cover rounded-xl mb-4 border border-white/10">
            <h2 id="modal-title" class="text-xl font-black italic uppercase mb-2"></h2>
            <p id="modal-desc" class="text-sm text-gray-400 mb-6 max-h-32 overflow-y-auto bg-white/5 p-3 rounded-lg"></p>
            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-xl font-black text-center text-sm">DESCARGAR</a>
        </div>
    </div>

    <div id="sidebar" class="liquid-glass menu-lateral p-6 overflow-y-auto bg-[#0b0b15]">
        <h2 class="font-black text-blue-500 text-3xl italic mb-8">MC ENDER</h2>
        <div id="user-profile" class="hidden mb-6 p-4 bg-white/5 rounded-2xl text-center">
            <img id="user-avatar" src="https://via.placeholder.com/100" class="w-16 h-16 rounded-full mx-auto border-2 border-blue-500 mb-3">
            <input type="text" id="user-name-input" class="bg-transparent text-center font-bold text-white w-full outline-none border-b border-white/10" placeholder="Nombre">
            <button onclick="guardarNombre()" class="text-[10px] text-blue-400 mt-2 font-black uppercase">💾 Guardar</button>
        </div>
        <nav class="space-y-3">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-xl bg-white/5 font-bold">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-xl bg-white/5 font-bold border border-blue-500/20">🚀 Publicar</button>
            <hr class="border-white/5 my-4">
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2 mb-4">
                    <input type="email" id="auth-email" placeholder="Correo" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-sm outline-none">
                    <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 text-sm outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="loginConEmail()" class="p-3 bg-blue-600/20 rounded-xl text-[10px] font-bold uppercase">Entrar</button>
                        <button onclick="registroConEmail()" class="p-3 bg-white/5 rounded-xl text-[10px] font-bold uppercase">Registro</button>
                    </div>
                </div>
                <button id="btn-login-google" onclick="iniciarSesionGoogle()" class="w-full p-4 rounded-xl bg-white/5 text-sm font-bold border border-white/10">Google Auth</button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full p-4 rounded-xl bg-red-600/10 text-red-400 font-bold border border-red-500/20">Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <header class="py-6 sticky top-0 bg-[#050505]/60 backdrop-blur-md z-40">
        <div class="flex items-center justify-between mb-4">
            <button onclick="toggleMenu()" class="liquid-glass w-12 h-12 flex items-center justify-center text-xl">☰</button>
            <div class="text-right">
                <h1 class="text-xl font-black text-blue-500 italic">MC ENDER</h1>
                <p class="text-[8px] text-gray-500 font-bold tracking-widest uppercase">Official</p>
            </div>
        </div>
        <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons..." class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500/50 text-sm">
    </header>

    <main>
        <div id="seccion-inicio">
            <div id="lista-addons" class="space-y-4">
                <div class="flex flex-col items-center justify-center py-20">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-xs text-gray-500 uppercase font-black">Conectando con la base de datos...</p>
                </div>
            </div>
        </div>

        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <h2 class="text-xl font-black mb-6 text-blue-500 text-center italic">NUEVO CONTENIDO</h2>
                <form onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="text" id="add-title" placeholder="Título" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none" required>
                    <select id="add-category" class="w-full bg-[#1a1a2e] p-4 rounded-xl border border-white/10 text-gray-400">
                        <option value="Addon">Addon</option>
                        <option value="Texture">Textura</option>
                        <option value="Map">Mapa</option>
                    </select>
                    <textarea id="add-desc" placeholder="Descripción..." class="w-full bg-white/5 p-4 rounded-xl border border-white/10 h-24 outline-none" required></textarea>
                    <input type="text" id="add-link" placeholder="Link de descarga" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none" required>
                    <input type="file" id="add-image" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white" required>
                    <button type="submit" id="btn-subir" class="btn-primary w-full py-4 rounded-xl font-black text-sm">PUBLICAR AHORA</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let usuarioActual = null;
        let esAdmin = false;
        let todosLosAddons = [];

        // FUNCIONES DE UI (Arreglado el error del menú)
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function irA(s) {
            toggleMenu(); // Cierra el menú al navegar
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            window.scrollTo(0,0);
        }

        function cerrarModal() { 
            document.getElementById('modal-detalle').classList.replace('flex', 'hidden'); 
        }

        // LÓGICA DE FIREBASE
        auth.onAuthStateChanged((user) => {
            usuarioActual = user;
            const logueado = !!user;
            document.getElementById('user-profile').classList.toggle('hidden', !logueado);
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !logueado);
            document.getElementById('btn-logout').classList.toggle('hidden', !logueado);
            document.getElementById('inputs-auth').classList.toggle('hidden', logueado);
            document.getElementById('btn-login-google').classList.toggle('hidden', logueado);

            if (user) {
                db.collection("usuarios").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        esAdmin = data.rol === "admin";
                        document.getElementById('user-name-input').value = data.nombre || "";
                        if(data.fotoPerfil) document.getElementById('user-avatar').src = data.fotoPerfil;
                    }
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        function mostrarAddons(lista) {
            const c = document.getElementById('lista-addons');
            c.innerHTML = "";
            
            if(lista.length === 0) {
                c.innerHTML = `<p class="text-center py-10 text-gray-500">No hay contenido disponible todavía.</p>`;
                return;
            }

            lista.forEach((d) => {
                const card = document.createElement('div');
                card.className = "liquid-glass p-3 flex gap-4 items-center addon-card border border-white/5";
                card.onclick = () => {
                    document.getElementById('modal-title').innerText = d.titulo;
                    document.getElementById('modal-desc').innerText = d.descripcion;
                    document.getElementById('modal-link').href = d.link;
                    document.getElementById('modal-img').src = d.foto;
                    const modal = document.getElementById('modal-detalle');
                    modal.classList.replace('hidden', 'flex');
                };

                card.innerHTML = `
                    <img src="${d.foto}" class="w-16 h-16 rounded-xl object-cover">
                    <div class="flex-1">
                        <span class="text-[7px] bg-blue-600 text-white px-2 py-0.5 rounded font-black uppercase">${d.categoria}</span>
                        <h3 class="text-lg font-black text-white italic leading-tight">${d.titulo}</h3>
                        <p class="text-[8px] text-gray-500 font-bold uppercase">Por: ${d.autor}</p>
                    </div>
                    ${esAdmin ? `<button onclick="event.stopPropagation(); borrarAddon('${d.id}')" class="text-red-500 p-2">🗑️</button>` : ''}
                `;
                c.appendChild(card);
            });
        }

        // CARGA DE DATOS REAL
        db.collection("addons").orderBy("fecha", "desc").onSnapshot((s) => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            buscarAddons();
        });

        function buscarAddons() {
            const t = document.getElementById('busqueda').value.toLowerCase();
            const f = todosLosAddons.filter(a => a.titulo.toLowerCase().includes(t));
            mostrarAddons(f);
        }

        // OTROS
        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function cerrarSesion() { auth.signOut().then(() => location.reload()); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert(e.message)); }
        function registroConEmail() { auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert(e.message)); }
        function borrarAddon(id) { if(confirm("¿Borrar?")) db.collection("addons").doc(id).delete(); }

        async function publicarAddon() {
            const btn = document.getElementById('btn-subir');
            const file = document.getElementById('add-image').files[0];
            if(!file) return alert("Sube una imagen");
            
            btn.disabled = true;
            btn.innerText = "SUBIENDO...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async (e) => {
                const foto = e.target.result;
                await db.collection("addons").add({
                    titulo: document.getElementById('add-title').value,
                    descripcion: document.getElementById('add-desc').value,
                    link: document.getElementById('add-link').value,
                    categoria: document.getElementById('add-category').value,
                    foto: foto,
                    autor: document.getElementById('user-name-input').value || "Explorador",
                    fecha: Date.now()
                });
                alert("¡Publicado!");
                irA('inicio');
                btn.disabled = false;
                btn.innerText = "PUBLICAR AHORA";
            };
        }
    </script>
</body>
</html>
