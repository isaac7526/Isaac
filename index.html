<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-glass: rgba(245, 245, 247, 0.75);
            --ios-accent: #007aff;
        }

        body { 
            background: linear-gradient(135deg, #e5e5ea 0%, #ffffff 100%); 
            color: #1c1c1e; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .liquid-glass { 
            background: var(--ios-glass); 
            backdrop-filter: blur(25px) saturate(180%); 
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
            border-radius: 30px; 
        }

        .menu-lateral { 
            transition: 0.6s cubic-bezier(0.32, 0.72, 0, 1); 
            transform: translateX(-110%); 
            position: fixed; top: 15px; left: 15px; bottom: 15px; width: 280px; z-index: 100; 
        }
        .menu-lateral.active { transform: translateX(0); }

        .addon-card { 
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .addon-card:active { transform: scale(0.95); }

        .overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.15); 
            z-index: 90; backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
        }
        .overlay.active { display: block; }

        input, select, textarea {
            background: rgba(0, 0, 0, 0.04) !important;
            border: 1px solid rgba(0,0,0,0.05) !important;
            border-radius: 14px !important;
            padding: 12px 16px !important;
        }
    </style>
</head>
<body class="max-w-lg mx-auto pb-24">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="modal-detalle" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm">
        <div class="liquid-glass w-full max-w-sm p-6 relative">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-gray-400 bg-gray-200/50 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
            <img id="modal-img" src="" class="w-full h-52 object-cover rounded-3xl mb-4 shadow-sm border border-white/50">
            <div id="modal-tag" class="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold mb-2 uppercase"></div>
            <h2 id="modal-title" class="text-xl font-extrabold text-gray-900 mb-2"></h2>
            <p id="modal-desc" class="text-sm text-gray-600 mb-6 max-h-40 overflow-y-auto leading-relaxed"></p>
            <a id="modal-link" href="#" target="_blank" class="block w-full py-4 bg-[#007aff] text-white rounded-2xl text-center font-bold shadow-lg shadow-blue-500/30">Descargar</a>
        </div>
    </div>

    <div id="sidebar" class="liquid-glass menu-lateral p-6 shadow-2xl flex flex-col">
        <h2 class="font-extrabold text-gray-900 text-3xl mb-8 tracking-tighter">MC ENDER</h2>
        
        <div id="user-profile" class="hidden mb-6 p-4 bg-white/30 rounded-3xl border border-white/40 text-center">
            <img id="user-avatar" src="" class="w-20 h-20 rounded-full border-4 border-white mx-auto shadow-sm object-cover">
            <input type="text" id="user-name-input" class="mt-3 text-center font-bold text-gray-800 w-full bg-transparent" placeholder="Tu Nombre">
            <button onclick="guardarNombre()" class="text-[10px] text-blue-500 mt-2 font-bold uppercase">Actualizar</button>
        </div>

        <nav class="space-y-2 flex-1">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/60 hover:bg-white font-bold transition-all">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/60 hover:bg-white font-bold transition-all">🚀 Publicar</button>
            <hr class="border-gray-200/50 my-4">
            
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2">
                    <input type="email" id="auth-email" placeholder="Email" class="w-full text-sm">
                    <input type="password" id="auth-pass" placeholder="Password" class="w-full text-sm">
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button onclick="loginConEmail()" class="p-3 rounded-xl bg-gray-900 text-white font-bold text-[10px] uppercase">Login</button>
                        <button onclick="registroConEmail()" class="p-3 rounded-xl bg-white text-gray-900 border border-gray-200 font-bold text-[10px] uppercase">Join</button>
                    </div>
                </div>
                <button id="btn-login-google" onclick="iniciarSesionGoogle()" class="w-full mt-4 p-4 rounded-2xl bg-white border border-gray-100 font-bold text-sm flex items-center justify-center gap-2">
                    <img src="https://www.google.com/favicon.ico" class="w-4"> Google
                </button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full p-4 rounded-2xl bg-red-50 text-red-500 font-bold text-sm">Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <header class="p-4 sticky top-0 z-40 bg-white/60 backdrop-blur-xl border-b border-gray-100">
        <div class="flex items-center justify-between mb-4">
            <button onclick="toggleMenu()" class="bg-gray-200/50 p-3 px-5 rounded-2xl text-xl active:scale-90 transition">☰</button>
            <div class="text-right">
                <h1 class="text-xl font-extrabold text-gray-900 tracking-tighter italic">MC ENDER</h1>
                <p class="text-[8px] text-blue-500 font-bold uppercase tracking-widest">Premium Edition</p>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons..." class="w-full p-4 pl-12 shadow-inner bg-gray-100">
            <span class="absolute left-4 top-4 text-gray-400">🔍</span>
        </div>
    </header>

    <main class="p-4">
        <div id="seccion-inicio" class="space-y-4">
            <div id="lista-addons"></div>
        </div>

        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <h2 class="text-xl font-extrabold mb-6 text-center tracking-tight text-gray-900">NUEVA PUBLICACIÓN</h2>
                <form id="form-publicar" onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="text" id="add-title" placeholder="¿Cómo se llama tu addon?" class="w-full" required>
                    <select id="add-category" class="w-full">
                        <option value="Addon">Categoría: Addon</option>
                        <option value="Texture">Categoría: Textura</option>
                        <option value="Map">Categoría: Mapa</option>
                    </select>
                    <textarea id="add-desc" placeholder="Escribe una descripción..." class="w-full h-24" required></textarea>
                    <input type="text" id="add-link" placeholder="Enlace de descarga" class="w-full" required>
                    <label class="w-full bg-gray-50 p-8 rounded-3xl border-2 border-dashed border-gray-200 flex flex-col items-center cursor-pointer">
                        <span id="file-name" class="text-xs font-bold text-gray-400">TOCA PARA SUBIR IMAGEN</span>
                        <input type="file" id="add-image" accept="image/*" class="hidden" onchange="actualizarNombreArchivo(this)" required>
                    </label>
                    <button type="submit" id="btn-subir" class="w-full py-5 bg-[#007aff] text-white rounded-3xl font-bold shadow-xl active:scale-95 transition-all">
                        PUBLICAR AHORA
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let usuarioActual = null;
        let esAdmin = false;
        let todosLosAddons = [];

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function irA(s) {
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            window.scrollTo(0,0);
        }

        auth.onAuthStateChanged((user) => {
            usuarioActual = user;
            document.getElementById('user-profile').classList.toggle('hidden', !user);
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !user);
            document.getElementById('btn-logout').classList.toggle('hidden', !user);
            document.getElementById('inputs-auth').classList.toggle('hidden', !!user);
            document.getElementById('btn-login-google').classList.toggle('hidden', !!user);

            if (user) {
                db.collection("usuarios").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        esAdmin = data.rol === "admin";
                        document.getElementById('user-name-input').value = data.nombre || "Miner";
                        document.getElementById('user-avatar').src = data.fotoPerfil || "https://via.placeholder.com/100";
                    }
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        function mostrarAddons(lista) {
            const container = document.getElementById('lista-addons');
            container.innerHTML = "";
            lista.forEach((d) => {
                const card = document.createElement('div');
                card.className = "addon-card p-4 flex gap-4 items-center relative mb-4 shadow-sm cursor-pointer";
                card.onclick = () => verDetalleAddon(d);

                card.innerHTML = `
                    <img src="${d.foto}" class="w-16 h-16 rounded-2xl object-cover shadow-sm bg-gray-200">
                    <div class="flex-1">
                        <span class="text-[9px] font-bold text-blue-500 uppercase tracking-tight">${d.categoria}</span>
                        <h3 class="text-base font-extrabold text-gray-900 leading-tight">${d.titulo}</h3>
                        <p class="text-[9px] text-gray-400 font-medium">Por ${d.autor}</p>
                    </div>
                    ${esAdmin ? `<button onclick="event.stopPropagation(); borrarAddon('${d.id}')" class="text-red-400 p-2 text-xl">×</button>` : '<span class="text-gray-300">〉</span>'}
                `;
                container.appendChild(card);
            });
        }

        function verDetalleAddon(data) {
            const modal = document.getElementById('modal-detalle');
            document.getElementById('modal-title').innerText = data.titulo;
            document.getElementById('modal-desc').innerText = data.descripcion;
            document.getElementById('modal-link').href = data.link;
            document.getElementById('modal-img').src = data.foto;
            document.getElementById('modal-tag').innerText = data.categoria;
            modal.classList.remove('hidden');
        }

        function cerrarModal() { 
            document.getElementById('modal-detalle').classList.add('hidden');
            document.getElementById('modal-img').src = ""; // Limpiamos la imagen
        }

        db.collection("addons").orderBy("fecha", "desc").onSnapshot((s) => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            buscarAddons();
        });

        function publicarAddon() {
            if (!usuarioActual) return alert("Inicia sesión primero");
            const btn = document.getElementById('btn-subir');
            const imgInput = document.getElementById('add-image').files[0];
            if(!imgInput) return alert("Falta la imagen");

            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    db.collection("addons").add({
                        titulo: document.getElementById('add-title').value,
                        descripcion: document.getElementById('add-desc').value,
                        link: document.getElementById('add-link').value,
                        categoria: document.getElementById('add-category').value,
                        foto: canvas.toDataURL('image/jpeg', 0.7),
                        autor: document.getElementById('user-name-input').value || "Miner",
                        fecha: Date.now()
                    }).then(() => {
                        document.getElementById('form-publicar').reset();
                        btn.disabled = false;
                        btn.innerText = "PUBLICAR AHORA";
                        irA('inicio');
                    });
                };
            };
            reader.readAsDataURL(imgInput);
        }

        function buscarAddons() {
            const t = document.getElementById('busqueda').value.toLowerCase();
            const f = todosLosAddons.filter(a => a.titulo.toLowerCase().includes(t));
            mostrarAddons(f);
        }
        function actualizarNombreArchivo(i) { if(i.files[0]) document.getElementById('file-name').innerText = "✅ IMAGEN CARGADA"; }
        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function cerrarSesion() { auth.signOut().then(() => location.reload()); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert("Error: " + e.message)); }
        function registroConEmail() { auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert("Error: " + e.message)); }
        function borrarAddon(id) { if(confirm("¿Seguro de borrar este addon?")) db.collection("addons").doc(id).delete(); }
    </script>
</body>
</html>
