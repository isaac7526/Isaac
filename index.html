<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #0b0b0b); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .menu-lateral { transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); position: fixed; top: 0; left: 0; height: 100%; width: 280px; z-index: 500; }
        .menu-lateral.active { transform: translateX(0); }
        .addon-card { transition: all 0.3s ease; cursor: pointer; }
        .addon-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.07); border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: 0.2s; }
        .btn-primary:active { scale: 0.95; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .header-fix { position: sticky; top: 0; z-index: 100; background: #0b0b0b; width: 100%; }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 16px; height: 16px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="max-w-lg mx-auto pb-24">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="modal-detalle" class="fixed inset-0 z-[600] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="liquid-glass w-full max-w-sm p-6 relative max-h-[90vh] overflow-y-auto no-scrollbar">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-2xl hover:text-red-500 z-10">✕</button>
            <img id="modal-img" src="" class="w-full h-52 object-cover rounded-2xl mb-4 border border-white/10 shadow-xl">
            <div id="modal-tag" class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 text-[10px] font-bold mb-2 uppercase"></div>
            <h2 id="modal-title" class="text-2xl font-black italic uppercase mb-2"></h2>
            <p id="modal-desc" class="text-sm text-gray-400 bg-white/5 p-4 rounded-xl mb-4"></p>
            <div class="flex justify-between text-[10px] text-gray-500 italic mb-4">
                <span id="modal-fecha"></span>
                <span id="modal-autor"></span>
            </div>
            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-2xl font-black text-center mb-6 shadow-lg uppercase tracking-widest">DESCARGAR</a>
            <div class="border-t border-white/10 pt-4">
                <h3 class="text-xs font-black uppercase text-blue-400 mb-4 italic">Comentarios</h3>
                <div id="comentar-form" class="hidden mb-6 flex gap-2">
                    <input type="text" id="nuevo-comentario" placeholder="Escribe algo..." class="flex-1 bg-white/5 p-3 rounded-xl border border-white/10 text-xs outline-none">
                    <button onclick="enviarComentario()" class="bg-blue-600 px-4 rounded-xl text-[10px] font-black">POST</button>
                </div>
                <p id="comentar-login-msg" class="text-[9px] text-gray-500 italic text-center">Inicia sesión para comentar.</p>
                <div id="lista-comentarios" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <div id="sidebar" class="liquid-glass menu-lateral p-6 m-2 shadow-2xl overflow-y-auto">
        <h2 class="font-black text-blue-400 text-3xl italic mb-6 tracking-tighter">MC ENDER</h2>
        
        <div id="user-info" class="hidden mb-6 p-4 bg-white/5 rounded-3xl border border-white/10">
            <div class="flex items-center gap-3 mb-4">
                <img id="user-avatar" src="https://via.placeholder.com/150" class="w-12 h-12 rounded-full border-2 border-blue-500 object-cover">
                <div>
                    <p id="user-name" class="font-black italic text-sm truncate w-32">Miner</p>
                    <p class="text-[8px] text-gray-500 uppercase font-bold tracking-widest">Usuario Verificado</p>
                </div>
            </div>
            <div class="space-y-2">
                <input type="text" id="edit-name" placeholder="Nuevo nombre" class="w-full bg-black/20 p-2 rounded-xl border border-white/5 text-[10px] outline-none">
                <input type="text" id="edit-photo" placeholder="URL de imagen" class="w-full bg-black/20 p-2 rounded-xl border border-white/5 text-[10px] outline-none">
                <button onclick="actualizarPerfil()" class="w-full py-2 bg-blue-600 rounded-xl text-[8px] font-black uppercase tracking-widest">Actualizar Perfil</button>
            </div>
        </div>

        <nav class="space-y-3">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition border border-blue-500/20">🚀 Publicar Addon</button>
            <hr class="border-white/10 my-4">
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2 mb-4">
                    <input type="email" id="auth-email" placeholder="Correo" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm">
                    <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm">
                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <button onclick="loginConEmail()" class="p-3 rounded-xl bg-blue-600/20 font-bold text-[10px] uppercase">Entrar</button>
                        <button onclick="registroConEmail()" class="p-3 rounded-xl bg-white/5 font-bold text-[10px] uppercase">Registro</button>
                    </div>
                </div>
                <button onclick="iniciarSesionGoogle()" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition border border-white/10 text-sm">🔵 Google Auth</button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full text-left p-4 rounded-2xl bg-red-600/10 hover:bg-red-600/20 font-bold text-red-400">🚪 Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <div class="header-fix">
        <header class="p-4 flex items-center justify-between bg-[#0b0b0b]/80 backdrop-blur-xl">
            <button onclick="toggleMenu()" class="liquid-glass p-3 px-5 text-xl relative z-[110] active:scale-90 transition">☰</button>
            <div class="text-right">
                <h1 class="text-xl font-black text-blue-400 italic tracking-tighter">MC ENDER</h1>
                <p class="text-[7px] text-gray-500 font-bold uppercase tracking-widest text-center">Official Website</p>
            </div>
        </header>
        <div class="px-4 pb-2">
            <div class="relative">
                <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons..." class="w-full bg-white/5 p-4 pl-12 rounded-2xl border border-white/10 outline-none text-sm">
                <span class="absolute left-4 top-4 text-gray-500">🔍</span>
            </div>
        </div>
        <div id="filtros-container" class="flex gap-2 px-4 py-3 overflow-x-auto no-scrollbar border-b border-white/5">
            <button onclick="ordenar('recientes')" class="flex-none px-4 py-2 rounded-xl bg-blue-600/20 border border-blue-500/30 text-[10px] font-black uppercase">✨ Recientes</button>
            <button onclick="ordenar('populares')" class="flex-none px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase">🔥 Populares</button>
        </div>
    </div>

    <main class="p-4">
        <div id="seccion-inicio"><div id="lista-addons" class="space-y-4"></div></div>
        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <h2 class="text-xl font-black mb-6 text-blue-400 italic text-center uppercase text-center">Subir Contenido</h2>
                <form id="form-publicar" onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="text" id="add-title" placeholder="Nombre del Addon" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <select id="add-category" class="w-full bg-[#1a1a2e] p-4 rounded-2xl border border-white/10 outline-none text-gray-400">
                        <option value="Addon">Tipo: Addon</option>
                        <option value="Texture">Tipo: Textura</option>
                        <option value="Map">Tipo: Mapa</option>
                    </select>
                    <textarea id="add-desc" placeholder="Descripción breve..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 h-24 outline-none" required></textarea>
                    <input type="text" id="add-link" placeholder="Link Directo" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <label class="w-full bg-white/5 p-6 rounded-3xl border-2 border-dashed border-white/10 flex flex-col items-center cursor-pointer">
                        <span id="file-name" class="text-[10px] font-black uppercase text-gray-400">Seleccionar Miniatura</span>
                        <input type="file" id="add-image" accept="image/*" class="hidden" onchange="actualizarNombreArchivo(this)" required>
                    </label>
                    <button type="submit" id="btn-subir" class="btn-primary w-full py-4 rounded-2xl font-black flex items-center justify-center gap-3">
                        <span id="btn-text">PUBLICAR AHORA</span>
                        <div id="btn-loader" class="loading-spinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let todosLosAddons = [];
        let esAdmin = false;
        let addonActualId = null;
        let unsubscribeComentarios = null;

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function irA(s) {
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        }

        // --- SISTEMA DE CUENTAS (ACTUALIZAR PERFIL) ---
        function actualizarPerfil() {
            const user = auth.currentUser;
            const nuevoNombre = document.getElementById('edit-name').value;
            const nuevaFoto = document.getElementById('edit-photo').value;

            if (user) {
                user.updateProfile({
                    displayName: nuevoNombre || user.displayName,
                    photoURL: nuevaFoto || user.photoURL
                }).then(() => {
                    alert("¡Perfil actualizado! Recargando...");
                    location.reload();
                }).catch(err => alert("Error: " + err.message));
            }
        }

        auth.onAuthStateChanged(user => {
            const logueado = !!user;
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !logueado);
            document.getElementById('btn-logout').classList.toggle('hidden', !logueado);
            document.getElementById('inputs-auth').classList.toggle('hidden', logueado);
            document.getElementById('user-info').classList.toggle('hidden', !logueado);

            if(user) {
                document.getElementById('user-name').innerText = user.displayName || "Miner";
                document.getElementById('user-avatar').src = user.photoURL || "https://via.placeholder.com/150";
                
                db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) esAdmin = doc.data().rol === "admin";
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        // --- COMENTARIOS Y DETALLES ---
        function verDetalle(d) {
            addonActualId = d.id;
            document.getElementById('modal-title').innerText = d.titulo;
            document.getElementById('modal-desc').innerText = d.descripcion;
            document.getElementById('modal-img').src = d.foto;
            document.getElementById('modal-tag').innerText = d.categoria;
            document.getElementById('modal-fecha').innerText = "Fecha: " + new Date(d.fecha).toLocaleDateString();
            document.getElementById('modal-autor').innerText = "By: " + d.autor;
            document.getElementById('modal-link').href = d.link;

            const user = auth.currentUser;
            document.getElementById('comentar-form').classList.toggle('hidden', !user);
            document.getElementById('comentar-login-msg').classList.toggle('hidden', !!user);

            cargarComentarios(d.id);
            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cargarComentarios(addonId) {
            const lista = document.getElementById('lista-comentarios');
            if(unsubscribeComentarios) unsubscribeComentarios();
            unsubscribeComentarios = db.collection("addons").doc(addonId).collection("comentarios").orderBy("fecha", "desc").onSnapshot(snap => {
                lista.innerHTML = "";
                snap.forEach(doc => {
                    const c = doc.data();
                    const div = document.createElement('div');
                    div.className = "bg-white/5 p-3 rounded-2xl border border-white/5 flex gap-3 items-start";
                    div.innerHTML = `
                        <img src="${c.avatar || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full border border-blue-500/30">
                        <div>
                            <p class="text-[9px] font-black text-blue-400">${c.usuario}</p>
                            <p class="text-[10px] text-gray-300">${c.texto}</p>
                        </div>
                    `;
                    lista.appendChild(div);
                });
            });
        }

        function enviarComentario() {
            const input = document.getElementById('nuevo-comentario');
            const user = auth.currentUser;
            if (!input.value.trim() || !user) return;

            db.collection("addons").doc(addonActualId).collection("comentarios").add({
                usuario: user.displayName || "Miner",
                avatar: user.photoURL || "",
                texto: input.value,
                fecha: Date.now()
            }).then(() => input.value = "");
        }

        // --- FUNCIONES BASE ---
        db.collection("addons").orderBy("fecha", "desc").onSnapshot(s => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            mostrarAddons(todosLosAddons);
        });

        function mostrarAddons(lista) {
            const cont = document.getElementById('lista-addons');
            cont.innerHTML = "";
            lista.forEach(d => {
                const btnBorrar = esAdmin ? `<button onclick="event.stopPropagation(); borrarAddon('${d.id}')" class="text-[10px] bg-red-500/20 text-red-400 px-3 py-1 rounded-lg ml-2">🗑️</button>` : "";
                const card = document.createElement('div');
                card.className = "liquid-glass p-3 flex gap-4 items-center addon-card border border-white/5";
                card.onclick = () => verDetalle(d);
                card.innerHTML = `<img src="${d.foto}" class="w-20 h-20 rounded-xl object-cover border border-white/10"><div class="flex-1"><div class="flex justify-between items-center"><span class="text-[8px] text-blue-400 font-bold uppercase bg-blue-500/10 px-2 py-0.5 rounded-full">${d.categoria}</span><div class="flex items-center"><span class="text-[9px] text-gray-500 italic">🔥 ${d.descargas || 0}</span>${btnBorrar}</div></div><h3 class="text-lg font-black italic uppercase leading-tight mt-1">${d.titulo}</h3><div class="flex justify-between text-[7px] text-gray-500 mt-1"><span>By: ${d.autor}</span></div></div>`;
                cont.appendChild(card);
            });
        }

        function borrarAddon(id) { if(confirm("¿Borrar?")) db.collection("addons").doc(id).delete(); }
        function cerrarModal() { document.getElementById('modal-detalle').classList.add('hidden'); }
        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function cerrarSesion() { auth.signOut().then(() => location.reload()); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
        function registroConEmail() { auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
        function actualizarNombreArchivo(i) { if(i.files[0]) document.getElementById('file-name').innerText = "✅ LISTO"; }
        function ordenar(modo) {
            let copia = [...todosLosAddons];
            if(modo === 'populares') copia.sort((a,b) => (b.descargas || 0) - (a.descargas || 0));
            mostrarAddons(copia);
        }
        function publicarAddon() {
            const btn = document.getElementById('btn-subir');
            const imgInput = document.getElementById('add-image').files[0];
            if(!imgInput) return;
            btn.disabled = true; document.getElementById('btn-loader').style.display = "block";
            const reader = new FileReader();
            reader.onload = (e) => {
                db.collection("addons").add({
                    titulo: document.getElementById('add-title').value,
                    descripcion: document.getElementById('add-desc').value,
                    link: document.getElementById('add-link').value,
                    categoria: document.getElementById('add-category').value,
                    foto: e.target.result,
                    fecha: Date.now(),
                    descargas: 0,
                    autor: auth.currentUser ? (auth.currentUser.displayName || "Miner") : "Miner"
                }).then(() => { location.reload(); });
            };
            reader.readAsDataURL(imgInput);
        }
    </script>
</body>
</html>
