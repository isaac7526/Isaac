<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official | Minecraft Addons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }
        body { 
            background: radial-gradient(circle at top, #1e1e38, #050505); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        /* Glassmorphism Refinado */
        .liquid-glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 24px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .menu-lateral { 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            transform: translateX(-110%); 
            position: fixed; top: 0; left: 0; 
            height: 100%; width: 300px; z-index: 100; 
        }
        .menu-lateral.active { transform: translateX(0); }

        /* Cards Animadas */
        .addon-card { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: rgba(255, 255, 255, 0.02);
        }
        .addon-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            background: rgba(255, 255, 255, 0.06); 
            border-color: var(--accent);
            box-shadow: 0 10px 20px -5px var(--accent-glow);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: 0.3s; 
        }
        .btn-primary:hover { brightness: 1.1; transform: translateY(-2px); }
        .btn-primary:active { transform: scale(0.95); }

        .loading-spinner { 
            border: 3px solid rgba(255,255,255,0.1); 
            border-top: 3px solid var(--accent); 
            border-radius: 50%; width: 24px; height: 24px; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.7); z-index: 90; 
            backdrop-filter: blur(8px); 
            transition: opacity 0.3s;
        }
        .overlay.active { display: block; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="max-w-xl mx-auto pb-24">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="modal-detalle" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4">
        <div class="liquid-glass w-full max-w-sm p-6 relative animate-in fade-in zoom-in duration-300 bg-[#0f0f1a]">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-red-500/20 hover:text-red-500 transition">✕</button>
            
            <img id="modal-img" src="" class="w-full h-56 object-cover rounded-2xl mb-5 shadow-2xl border border-white/5">
            
            <div class="flex justify-between items-center mb-3">
                <div id="modal-tag" class="px-3 py-1 rounded-lg bg-blue-500/10 text-blue-400 text-[10px] font-black uppercase border border-blue-500/20"></div>
                <div id="modal-autor" class="text-[10px] text-gray-500 italic"></div>
            </div>

            <h2 id="modal-title" class="text-2xl font-black text-white italic uppercase mb-3 leading-none"></h2>
            
            <div class="bg-white/5 rounded-2xl p-4 mb-6">
                <p id="modal-desc" class="text-sm text-gray-300 leading-relaxed max-h-32 overflow-y-auto"></p>
            </div>

            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-2xl font-black text-center text-sm tracking-widest uppercase">DESCARGAR CONTENIDO</a>
        </div>
    </div>

    <div id="sidebar" class="liquid-glass menu-lateral p-8 shadow-2xl overflow-y-auto border-r border-white/10">
        <div class="mb-10 text-center">
            <h2 class="font-black text-blue-500 text-4xl italic tracking-tighter">MC ENDER</h2>
            <div class="h-1 w-12 bg-blue-500 mx-auto mt-2 rounded-full"></div>
        </div>

        <div id="user-profile" class="hidden mb-10 p-5 liquid-glass bg-white/5 border-white/10 text-center relative">
            <div class="relative inline-block group">
                <img id="user-avatar" src="https://via.placeholder.com/100" class="w-24 h-24 rounded-3xl border-2 border-blue-500 mx-auto shadow-2xl transform transition group-hover:scale-105">
                <label class="absolute -bottom-2 -right-2 bg-blue-600 p-2 rounded-xl cursor-pointer hover:bg-blue-500 shadow-lg">
                    <span>📷</span>
                    <input type="file" id="change-avatar" class="hidden" accept="image/*" onchange="subirFotoPerfil(this)">
                </label>
            </div>
            <div class="mt-5">
                <input type="text" id="user-name-input" class="bg-transparent text-center font-black text-white italic w-full outline-none border-b-2 border-white/5 focus:border-blue-500 transition py-1" placeholder="Tu Nombre">
                <button onclick="guardarNombre()" class="text-[10px] text-blue-400 mt-4 uppercase font-black tracking-[0.2em] block mx-auto hover:text-white transition">💾 Actualizar Perfil</button>
            </div>
        </div>

        <nav class="space-y-4">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-blue-500/10 hover:text-blue-400 font-bold transition flex items-center gap-3">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-blue-500/10 hover:text-blue-400 font-bold transition border border-white/5">🚀 Publicar Addon</button>
            
            <div id="auth-container" class="pt-6">
                <div id="inputs-auth" class="space-y-3 mb-6">
                    <input type="email" id="auth-email" placeholder="Email" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm focus:border-blue-500 transition">
                    <input type="password" id="auth-pass" placeholder="Password" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm focus:border-blue-500 transition">
                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <button onclick="loginConEmail()" class="p-4 rounded-2xl bg-blue-600/10 hover:bg-blue-600/30 font-black text-[10px] border border-blue-500/30 uppercase tracking-wider">Entrar</button>
                        <button onclick="registroConEmail()" class="p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-black text-[10px] border border-white/10 uppercase tracking-wider">Unirse</button>
                    </div>
                </div>
                <button id="btn-login-google" onclick="iniciarSesionGoogle()" class="w-full text-center p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition border border-white/10 text-xs flex items-center justify-center gap-2">
                   <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4"> Google Auth
                </button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full p-4 rounded-2xl bg-red-500/10 hover:bg-red-500/20 font-bold transition border border-red-500/20 text-red-400 text-xs uppercase">Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <header class="p-6 sticky top-0 z-40 bg-[#050505]/60 backdrop-blur-2xl border-b border-white/5">
        <div class="flex items-center justify-between mb-6">
            <button onclick="toggleMenu()" class="liquid-glass w-12 h-12 flex items-center justify-center text-xl hover:bg-white/5 transition">☰</button>
            <div class="text-right">
                <h1 class="text-2xl font-black text-blue-500 italic tracking-tighter leading-none">MC ENDER</h1>
                <p class="text-[8px] text-gray-500 font-black uppercase tracking-[0.3em]">Marketplace</p>
            </div>
        </div>
        <div class="relative group">
            <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar contenido..." class="w-full bg-white/5 p-4 pl-12 rounded-2xl border border-white/5 outline-none focus:border-blue-500/50 focus:bg-white/10 text-sm transition-all shadow-inner">
            <span class="absolute left-4 top-4 text-gray-500 group-focus-within:text-blue-500 transition">🔍</span>
        </div>
    </header>

    <main class="p-6">
        <div id="seccion-inicio">
            <div id="lista-addons" class="grid grid-cols-1 gap-5">
                <div class="flex flex-col items-center justify-center py-20 opacity-20">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-xs font-bold uppercase tracking-widest">Cargando Galería...</p>
                </div>
            </div>
        </div>

        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-8 border-blue-500/10">
                <h2 class="text-2xl font-black mb-8 text-blue-500 italic text-center uppercase tracking-tighter">Subir nuevo contenido</h2>
                <form id="form-publicar" onsubmit="event.preventDefault(); publicarAddon();" class="space-y-5">
                    <input type="text" id="add-title" placeholder="Título del Addon" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-blue-500 transition" required>
                    
                    <div class="relative">
                        <select id="add-category" class="w-full bg-[#1a1a2e] p-4 rounded-2xl border border-white/10 outline-none text-gray-400 appearance-none cursor-pointer">
                            <option value="Addon">Categoría: Addon</option>
                            <option value="Texture">Categoría: Textura</option>
                            <option value="Map">Categoría: Mapa</option>
                        </select>
                        <span class="absolute right-4 top-5 pointer-events-none opacity-50">▼</span>
                    </div>

                    <textarea id="add-desc" placeholder="Describe qué hace tu creación..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 h-32 outline-none focus:border-blue-500 transition resize-none" required></textarea>
                    
                    <input type="text" id="add-link" placeholder="Enlace de descarga (Mediafire/Drive)" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-blue-500 transition" required>
                    
                    <label class="w-full bg-white/5 p-8 rounded-3xl border-2 border-dashed border-white/10 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-500/5 hover:border-blue-500/50 transition-all group">
                        <div class="w-12 h-12 mb-3 rounded-full bg-white/5 flex items-center justify-center text-xl group-hover:scale-110 transition">🖼️</div>
                        <span id="file-name" class="text-[10px] font-black uppercase text-gray-500 group-hover:text-blue-400 transition">Toca para subir miniatura</span>
                        <input type="file" id="add-image" accept="image/*" class="hidden" onchange="actualizarNombreArchivo(this)" required>
                    </label>

                    <button type="submit" id="btn-subir" class="btn-primary w-full py-5 rounded-2xl font-black text-sm flex items-center justify-center gap-4 tracking-widest">
                        <span id="btn-text">PUBLICAR EN LA TIENDA</span>
                        <div id="btn-loader" class="loading-spinner" style="display:none"></div>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // MANTENEMOS TU CONFIGURACIÓN ORIGINAL DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let usuarioActual = null;
        let esAdmin = false;
        let todosLosAddons = [];

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function irA(s) {
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        auth.onAuthStateChanged((user) => {
            usuarioActual = user;
            const logueado = !!user;
            document.getElementById('user-profile').classList.toggle('hidden', !logueado);
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !logueado);
            document.getElementById('btn-logout').classList.toggle('hidden', !logueado);
            document.getElementById('inputs-auth').classList.toggle('hidden', logueado);
            document.getElementById('btn-login-google').classList.toggle('hidden', logueado);

            if (user) {
                db.collection("usuarios").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        esAdmin = data.rol === "admin";
                        document.getElementById('user-name-input').value = data.nombre || "";
                        document.getElementById('user-avatar').src = data.fotoPerfil || "https://via.placeholder.com/100";
                    }
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        function mostrarAddons(lista) {
            const c = document.getElementById('lista-addons');
            c.innerHTML = "";
            
            if(lista.length === 0) {
                c.innerHTML = `<div class="text-center py-20 opacity-30 font-black uppercase text-xs">No se encontraron resultados</div>`;
                return;
            }

            lista.forEach((d) => {
                const btnBorrar = esAdmin ? `<button onclick="event.stopPropagation(); borrarAddon('${d.id}')" class="bg-red-500/20 text-red-500 p-2 rounded-xl border border-red-500/20 hover:bg-red-500 hover:text-white transition">🗑️</button>` : "";
                
                const card = document.createElement('div');
                card.className = "liquid-glass p-4 flex gap-5 items-center addon-card border border-white/5 relative cursor-pointer";
                
                card.onclick = () => verDetalleAddon(d);

                card.innerHTML = `
                    <div class="relative">
                        <img src="${d.foto}" class="w-24 h-24 rounded-2xl object-cover border border-white/10 shadow-lg">
                        <span class="absolute -top-2 -left-2 text-[8px] bg-blue-600 text-white px-2 py-1 rounded-lg font-black uppercase shadow-lg">${d.categoria}</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="text-lg font-black text-white uppercase italic leading-tight">${d.titulo}</h3>
                            ${btnBorrar}
                        </div>
                        <p class="text-[9px] text-blue-400 font-black uppercase mt-2 tracking-widest">By ${d.autor}</p>
                        <div class="flex items-center gap-2 mt-3">
                            <div class="h-1 flex-1 bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500 w-full opacity-50"></div>
                            </div>
                            <span class="text-[8px] text-gray-500 font-bold uppercase">Ver más</span>
                        </div>
                    </div>
                `;
                c.appendChild(card);
            });
        }

        function verDetalleAddon(data) {
            document.getElementById('modal-title').innerText = data.titulo;
            document.getElementById('modal-desc').innerText = data.descripcion;
            document.getElementById('modal-link').href = data.link;
            document.getElementById('modal-img').src = data.foto;
            document.getElementById('modal-tag').innerText = data.categoria;
            document.getElementById('modal-autor').innerText = "CREADO POR: " + data.autor.toUpperCase();
            
            const m = document.getElementById('modal-detalle');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        db.collection("addons").orderBy("fecha", "desc").onSnapshot((s) => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            buscarAddons();
        });

        function publicarAddon() {
            const btn = document.getElementById('btn-subir');
            const loader = document.getElementById('btn-loader');
            const txt = document.getElementById('btn-text');
            const imgInput = document.getElementById('add-image').files[0];

            if(!imgInput) return alert("Por favor, selecciona una imagen");

            btn.disabled = true;
            loader.style.display = "inline-block";
            txt.innerText = "SUBIENDO...";

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const fotoComprimida = canvas.toDataURL('image/jpeg', 0.8);

                    db.collection("addons").add({
                        titulo: document.getElementById('add-title').value,
