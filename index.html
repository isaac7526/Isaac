<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #0b0b0b); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .menu-lateral { transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        .menu-lateral.active { transform: translateX(0); }
        .addon-card { transition: all 0.3s ease; }
        .addon-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.07); border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: 0.2s; }
        .btn-primary:active { scale: 0.98; }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #user-avatar { object-fit: cover; }
    </style>
</head>
<body class="max-w-lg mx-auto pb-24">

    <div id="modal-detalle" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="liquid-glass w-full max-w-sm p-6 relative">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-2xl hover:text-red-500">✕</button>
            <img id="modal-img" src="" class="w-full h-52 object-cover rounded-2xl mb-4 shadow-xl border border-white/10">
            <div id="modal-tag" class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 text-[10px] font-bold mb-2 uppercase"></div>
            <h2 id="modal-title" class="text-2xl font-black text-white italic uppercase mb-2"></h2>
            <p id="modal-desc" class="text-sm text-gray-400 bg-white/5 p-4 rounded-xl mb-6 max-h-32 overflow-y-auto"></p>
            <div id="modal-autor" class="text-[10px] text-gray-500 mb-4 italic text-right"></div>
            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-2xl font-black text-center shadow-lg shadow-blue-500/20">DESCARGAR AHORA</a>
        </div>
    </div>

    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 liquid-glass z-50 p-6 menu-lateral m-2 shadow-2xl overflow-y-auto">
        <h2 class="font-black text-blue-400 text-3xl italic mb-6 tracking-tighter">MC ENDER</h2>
        
        <div id="user-profile" class="hidden mb-8 p-4 liquid-glass border-blue-500/20 text-center">
            <div class="relative inline-block">
                <img id="user-avatar" src="https://via.placeholder.com/100" class="w-20 h-20 rounded-full border-2 border-blue-500 mx-auto shadow-xl">
                <label class="absolute bottom-0 right-0 bg-blue-600 p-1.5 rounded-full cursor-pointer hover:scale-110 transition">
                    <span class="text-xs">📷</span>
                    <input type="file" id="change-avatar" class="hidden" accept="image/*" onchange="subirFotoPerfil(this)">
                </label>
            </div>
            <div class="mt-3">
                <input type="text" id="user-name-input" class="bg-transparent text-center font-bold text-white italic w-full outline-none border-b border-white/10 focus:border-blue-500 text-sm" placeholder="Tu Nombre">
                <button onclick="guardarNombre()" class="text-[9px] text-blue-400 mt-2 uppercase font-black tracking-widest">💾 Guardar Cambios</button>
            </div>
        </div>

        <nav class="space-y-3">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition border border-blue-500/20">🚀 Publicar Addon</button>
            <hr class="border-white/10 my-4">
            
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2 mb-4">
                    <input type="email" id="auth-email" placeholder="Correo" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm focus:border-blue-500">
                    <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm focus:border-blue-500">
                    <div class="grid grid-cols-2 gap-2 mt-4">
                        <button onclick="loginConEmail()" class="p-3 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 font-bold text-[10px] border border-blue-500/50 uppercase">Entrar</button>
                        <button onclick="registroConEmail()" class="p-3 rounded-xl bg-white/5 hover:bg-white/10 font-bold text-[10px] border border-white/20 uppercase">Registrar</button>
                    </div>
                </div>
                <div id="social-auth-label" class="text-[9px] text-gray-500 text-center mb-4 italic uppercase tracking-widest">O usa Google</div>
                <button id="btn-login-google" onclick="iniciarSesionGoogle()" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold transition border border-white/10 text-sm">🔵 Google Auth</button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full text-left p-4 rounded-2xl bg-red-600/10 hover:bg-red-600/20 font-bold transition border border-red-500/20 text-red-400">🚪 Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <header class="p-4 sticky top-0 z-40 bg-[#0b0b0b]/80 backdrop-blur-xl border-b border-white/5">
        <div class="flex items-center justify-between mb-4">
            <button onclick="toggleMenu()" class="liquid-glass p-3 px-5 text-xl active:scale-90 transition">☰</button>
            <div class="text-right">
                <h1 class="text-xl font-black text-blue-400 italic tracking-tighter">MC ENDER</h1>
                <p class="text-[7px] text-gray-500 font-bold uppercase tracking-widest">Official Website</p>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons, texturas..." class="w-full bg-white/5 p-4 pl-12 rounded-2xl border border-white/10 outline-none focus:border-blue-500/50 text-sm transition-all">
            <span class="absolute left-4 top-4 text-gray-500">🔍</span>
        </div>
    </header>

    <main class="p-4">
        <div id="seccion-inicio">
            <div id="lista-addons" class="space-y-4">
                <div class="text-center py-10"><div class="inline-block loading-spinner" style="display: inline-block;"></div></div>
            </div>
        </div>

        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <h2 class="text-xl font-black mb-6 text-blue-400 italic text-center uppercase">Subir Contenido</h2>
                <form id="form-publicar" onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="text" id="add-title" placeholder="Nombre del Addon" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <select id="add-category" class="w-full bg-[#1a1a2e] p-4 rounded-2xl border border-white/10 outline-none text-gray-400">
                        <option value="Addon">Tipo: Addon</option>
                        <option value="Texture">Tipo: Textura</option>
                        <option value="Map">Tipo: Mapa</option>
                        <option value="Skin">Tipo: Skin</option>
                    </select>
                    <textarea id="add-desc" placeholder="Descripción breve..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 h-24 outline-none" required></textarea>
                    <input type="text" id="add-link" placeholder="Link Directo (Mediafire/Drive)" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <label class="w-full bg-white/5 p-6 rounded-3xl border-2 border-dashed border-white/10 flex flex-col items-center cursor-pointer hover:bg-white/10 transition">
                        <span id="file-name" class="text-[10px] font-black uppercase text-gray-400 text-center">Seleccionar Miniatura (Imagen)</span>
                        <input type="file" id="add-image" accept="image/*" class="hidden" onchange="actualizarNombreArchivo(this)" required>
                    </label>
                    <button type="submit" id="btn-subir" class="btn-primary w-full py-4 rounded-2xl font-black flex items-center justify-center gap-3">
                        <span id="btn-text">PUBLICAR AHORA</span>
                        <div id="btn-loader" class="loading-spinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163",
            measurementId: "G-B4WHQ6VN52"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        
        let usuarioActual = null;
        let esAdmin = false;
        let todosLosAddons = [];

        auth.onAuthStateChanged((user) => {
            usuarioActual = user;
            const logueado = !!user;
            document.getElementById('user-profile').classList.toggle('hidden', !logueado);
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !logueado);
            document.getElementById('btn-logout').classList.toggle('hidden', !logueado);
            document.getElementById('inputs-auth').classList.toggle('hidden', logueado);
            document.getElementById('social-auth-label').classList.toggle('hidden', logueado);
            document.getElementById('btn-login-google').classList.toggle('hidden', logueado);

            if (user) {
                db.collection("usuarios").doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        // Corregido: busca 'admin' en minúsculas para coincidir con tu Firebase
                        esAdmin = data.rol === "admin"; 
                        document.getElementById('user-name-input').value = data.nombre || "";
                        document.getElementById('user-avatar').src = data.fotoPerfil || "https://via.placeholder.com/100";
                    } else {
                        db.collection("usuarios").doc(user.uid).set({
                            nombre: user.displayName || "Miner",
                            fotoPerfil: user.photoURL || "https://via.placeholder.com/100",
                            rol: "user"
                        });
                    }
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        function guardarNombre() {
            const nuevoNombre = document.getElementById('user-name-input').value;
            if (nuevoNombre && usuarioActual) {
                db.collection("usuarios").doc(usuarioActual.uid).update({ nombre: nuevoNombre })
                    .then(() => alert("¡Nombre guardado!"));
            }
        }

        function subirFotoPerfil(input) {
            if (input.files && input.files[0] && usuarioActual) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    db.collection("usuarios").doc(usuarioActual.uid).update({ fotoPerfil: e.target.result })
                        .then(() => alert("¡Foto actualizada!"));
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function buscarAddons() {
            const t = document.getElementById('busqueda').value.toLowerCase();
            const f = todosLosAddons.filter(a => a.titulo.toLowerCase().includes(t) || a.categoria.toLowerCase().includes(t));
            mostrarAddons(f);
        }

        function mostrarAddons(lista) {
            const c = document.getElementById('lista-addons');
            c.innerHTML = "";
            lista.forEach((d) => {
                const btn = esAdmin ? `<button onclick="borrarAddon('${d.id}')" class="text-[10px] bg-red-500/20 text-red-400 px-3 py-1 rounded-lg border border-red-500/30">Eliminar 🗑️</button>` : "";
                const card = `
                <div class="liquid-glass p-3 flex gap-4 items-center addon-card border border-white/5 mb-4 relative">
                    <img onclick="abrirModal(\`${d.titulo}\`, \`${d.descripcion}\`, \`${d.link}\`, \`${d.foto}\`, \`${d.categoria}\`, \`${d.autor}\` )" src="${d.foto}" class="w-20 h-20 rounded-xl object-cover border border-white/10 cursor-pointer">
                    <div class="flex-1 text-left">
                        <div class="flex justify-between items-start">
                            <span class="text-[8px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-bold uppercase">${d.categoria}</span>
                            ${btn}
                        </div>
                        <div onclick="abrirModal(\`${d.titulo}\`, \`${d.descripcion}\`, \`${d.link}\`, \`${d.foto}\`, \`${d.categoria}\`, \`${d.autor}\` )" class="text-lg font-black text-white uppercase italic leading-tight mt-1 cursor-pointer">${d.titulo}</div>
                        <p class="text-[7px] text-gray-500 font-bold uppercase mt-1">Por: ${d.autor}</p>
                    </div>
                </div>`;
                c.insertAdjacentHTML('beforeend', card);
            });
        }

        db.collection("addons").orderBy("fecha", "desc").onSnapshot((s) => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            buscarAddons();
        });

        // NUEVA FUNCIÓN: PUBLICAR CON COMPRESIÓN DE IMAGEN
        function publicarAddon() {
            if(!usuarioActual) return alert("Inicia sesión");
            
            const btn = document.getElementById('btn-subir');
            const loader = document.getElementById('btn-loader');
            const txt = document.getElementById('btn-text');
            const imgInput = document.getElementById('add-image').files[0];

            if(!imgInput) return alert("Selecciona una imagen");

            btn.disabled = true;
            loader.style.display = "block";
            txt.innerText = "COMPRIMIENDO...";

            db.collection("usuarios").doc(usuarioActual.uid).get().then((uDoc) => {
                const autor = uDoc.exists ? uDoc.data().nombre : (usuarioActual.displayName || "Miner");
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        // Canvas para comprimir
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Calidad al 70% (JPEG) para que no pese casi nada
                        const fotoComprimida = canvas.toDataURL('image/jpeg', 0.7);
                        
                        txt.innerText = "SUBIENDO...";

                        db.collection("addons").add({
                            titulo: document.getElementById('add-title').value,
                            descripcion: document.getElementById('add-desc').value,
                            link: document.getElementById('add-link').value,
                            categoria: document.getElementById('add-category').value,
                            foto: fotoComprimida, 
                            autor: autor,
                            fecha: Date.now()
                        }).then(() => {
                            alert("✅ ¡Addon Publicado!");
                            document.getElementById('form-publicar').reset();
                            document.getElementById('file-name').innerText = "SELECCIONAR MINIATURA (IMAGEN)";
                            btn.disabled = false;
                            loader.style.display = "none";
                            txt.innerText = "PUBLICAR AHORA";
                            irA('inicio');
                        }).catch(err => {
                            alert("Error: " + err.message);
                            btn.disabled = false;
                            loader.style.display = "none";
                            txt.innerText = "PUBLICAR AHORA";
                        });
                    };
                };
                reader.readAsDataURL(imgInput);
            });
        }

        function borrarAddon(id) {
            if (esAdmin && confirm("¿Borrar este contenido?")) db.collection("addons").doc(id).delete();
        }

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
        function irA(s) { 
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            window.scrollTo(0,0);
        }
        function abrirModal(t, d, l, i, c, a) {
            document.getElementById('modal-title').innerText = t;
            document.getElementById('modal-desc').innerText = d;
            document.getElementById('modal-link').href = l;
            document.getElementById('modal-img').src = i;
            document.getElementById('modal-tag').innerText = c;
            document.getElementById('modal-autor').innerText = "By: " + a;
            document.getElementById('modal-detalle').classList.remove('hidden');
        }
        function cerrarModal() { document.getElementById('modal-detalle').classList.add('hidden'); }
        function actualizarNombreArchivo(i) { if(i.files[0]) document.getElementById('file-name').innerText = "✅ " + i.files[0].name.toUpperCase(); }
        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function cerrarSesion() { auth.signOut(); location.reload(); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth
