<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #0b0b0b); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .menu-lateral { transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); position: fixed; top: 0; left: 0; height: 100%; width: 280px; z-index: 500; }
        .menu-lateral.active { transform: translateX(0); }
        .addon-card { transition: all 0.3s ease; cursor: pointer; }
        .addon-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.07); border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: 0.2s; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .header-fix { position: sticky; top: 0; z-index: 100; background: #0b0b0b; width: 100%; }
    </style>
</head>
<body class="max-w-lg mx-auto pb-24">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="sidebar" class="liquid-glass menu-lateral p-6 m-2 shadow-2xl overflow-y-auto">
        <h2 class="font-black text-blue-400 text-3xl italic mb-6">MC ENDER</h2>
        
        <div id="user-info" class="hidden mb-6 p-4 bg-white/5 rounded-3xl border border-white/10">
            <div class="flex items-center gap-3 mb-4">
                <label class="relative cursor-pointer">
                    <img id="user-avatar" src="https://via.placeholder.com/150" class="w-14 h-14 rounded-full border-2 border-blue-500 object-cover">
                    <input type="file" id="input-avatar" accept="image/*" class="hidden" onchange="cambiarFotoPerfil(this)">
                    <span class="absolute bottom-0 right-0 bg-blue-600 rounded-full w-5 h-5 flex items-center justify-center text-[8px] border border-black">📷</span>
                </label>
                <div>
                    <p id="user-name" class="font-black italic text-sm truncate w-32">Miner</p>
                </div>
            </div>
            <input type="text" id="edit-name" placeholder="Nuevo nombre..." class="w-full bg-black/20 p-2 rounded-xl border border-white/5 text-[10px] outline-none mb-2">
            <button onclick="actualizarNombre()" class="w-full py-2 bg-blue-600/20 border border-blue-500/40 rounded-xl text-[8px] font-black uppercase">Actualizar Perfil</button>
        </div>

        <nav class="space-y-3">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/5 font-bold">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/5 border border-blue-500/20 font-bold">🚀 Publicar Addon</button>
            <hr class="border-white/10">
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2 mb-4">
                    <input type="email" id="auth-email" placeholder="Correo" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-sm">
                    <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-sm">
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button onclick="loginConEmail()" class="p-3 rounded-xl bg-blue-600/20 font-bold text-[10px] uppercase">Entrar</button>
                        <button onclick="registroConEmail()" class="p-3 rounded-xl bg-white/5 font-bold text-[10px] uppercase">Registro</button>
                    </div>
                </div>
                <button onclick="iniciarSesionGoogle()" class="w-full text-left p-4 rounded-2xl bg-white/5 font-bold text-sm border border-white/10">🔵 Google Auth</button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full text-left p-4 rounded-2xl bg-red-600/10 font-bold text-red-400 mt-2">🚪 Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <div id="modal-detalle" class="fixed inset-0 z-[600] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="liquid-glass w-full max-w-sm p-6 relative max-h-[90vh] overflow-y-auto no-scrollbar">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-2xl">✕</button>
            <img id="modal-img" src="" class="w-full h-52 object-cover rounded-2xl mb-4">
            <h2 id="modal-title" class="text-2xl font-black italic uppercase mb-2 text-blue-400"></h2>
            <p id="modal-desc" class="text-sm text-gray-400 bg-white/5 p-4 rounded-xl mb-4"></p>
            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-2xl font-black text-center mb-6 uppercase">DESCARGAR</a>
            <div id="comentar-form" class="hidden mb-6 flex gap-2">
                <input type="text" id="nuevo-comentario" placeholder="Comentar..." class="flex-1 bg-white/5 p-3 rounded-xl border border-white/10 text-xs">
                <button onclick="enviarComentario()" class="bg-blue-600 px-4 rounded-xl text-[10px] font-black uppercase">Post</button>
            </div>
            <div id="lista-comentarios" class="space-y-3"></div>
        </div>
    </div>

    <div class="header-fix">
        <header class="p-4 flex items-center justify-between">
            <button onclick="toggleMenu()" class="liquid-glass p-3 px-5 text-xl relative z-[110]">☰</button>
            <h1 class="text-xl font-black text-blue-400 italic">MC ENDER</h1>
        </header>
        <div class="px-4 pb-2">
            <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm">
        </div>
        <div class="flex gap-2 px-4 py-3 overflow-x-auto no-scrollbar">
            <button onclick="ordenar('recientes')" class="flex-none px-4 py-2 rounded-xl bg-blue-600/20 border border-blue-500/30 text-[10px] font-black uppercase">✨ Recientes</button>
            <button onclick="ordenar('populares')" class="flex-none px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase">🔥 Populares</button>
            <button onclick="ordenar('antiguos')" class="flex-none px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase">⏳ Antiguos</button>
        </div>
    </div>

    <main class="p-4">
        <div id="seccion-inicio"><div id="lista-addons" class="space-y-4"></div></div>
        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <form id="form-addon" onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="add-title" placeholder="Nombre" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <textarea id="add-desc" placeholder="Descripción..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 h-24 outline-none" required></textarea>
                    <input type="text" id="add-link" placeholder="Enlace" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <label class="w-full bg-white/5 p-8 rounded-3xl border-2 border-dashed border-white/10 flex flex-col items-center justify-center cursor-pointer">
                        <span id="file-label-text" class="text-[10px] font-black uppercase">Seleccionar Miniatura</span>
                        <input type="file" id="add-image" accept="image/*" class="hidden" onchange="if(this.files[0]) document.getElementById('file-label-text').innerText='✅ LISTO'">
                    </label>
                    <button type="submit" class="btn-primary w-full py-4 rounded-2xl font-black uppercase">PUBLICAR</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // CONFIGURACIÓN (REVISADA)
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let todosLosAddons = [];
        let esAdmin = false;
        let addonActualId = null;

        // FUNCIONES DE INTERFAZ (INMEDIATAS)
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function irA(s) {
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            toggleMenu();
        }

        function cerrarModal() { document.getElementById('modal-detalle').classList.add('hidden'); }

        // CARGA DE ADDONS (NO ESPERA AL LOGIN)
        db.collection("addons").orderBy("fecha", "desc").onSnapshot(s => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            mostrarAddons(todosLosAddons);
        });

        function mostrarAddons(lista) {
            const cont = document.getElementById('lista-addons');
            if(!cont) return;
            cont.innerHTML = "";
            lista.forEach(d => {
                const card = document.createElement('div');
                card.className = "liquid-glass p-3 flex gap-4 items-center addon-card";
                card.onclick = () => verDetalle(d);
                card.innerHTML = `
                    <img src="${d.foto}" class="w-20 h-20 rounded-xl object-cover border border-white/10">
                    <div class="flex-1">
                        <h3 class="text-lg font-black italic uppercase leading-tight">${d.titulo}</h3>
                        <p class="text-[7px] text-gray-500 uppercase">By: ${d.autor}</p>
                        ${esAdmin ? `<div class="flex gap-1 mt-2">
                            <button onclick="event.stopPropagation(); prepararEdicion('${d.id}')" class="bg-blue-500/20 text-blue-400 p-1 rounded px-2 text-[8px]">✏️</button>
                            <button onclick="event.stopPropagation(); borrarAddon('${d.id}')" class="bg-red-500/20 text-red-400 p-1 rounded px-2 text-[8px]">🗑️</button>
                        </div>` : ""}
                    </div>`;
                cont.appendChild(card);
            });
        }

        // CONTROL DE USUARIOS Y ADMIN
        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                document.getElementById('btn-menu-publicar').classList.remove('hidden');
                document.getElementById('inputs-auth').classList.add('hidden');
                document.getElementById('user-name').innerText = user.displayName || "Miner";
                
                db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        esAdmin = (doc.data().rol === "admin");
                        if(doc.data().fotoPerfil) document.getElementById('user-avatar').src = doc.data().fotoPerfil;
                    }
                    mostrarAddons(todosLosAddons); // Refresca para mostrar botones admin si existen
                });
            } else {
                esAdmin = false;
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('btn-logout').classList.add('hidden');
                document.getElementById('btn-menu-publicar').classList.add('hidden');
                document.getElementById('inputs-auth').classList.remove('hidden');
                mostrarAddons(todosLosAddons);
            }
        });

        // FUNCIONES DE PODER (ADMIN)
        function borrarAddon(id) { if(confirm("¿Borrar?")) db.collection("addons").doc(id).delete(); }
        function prepararEdicion(id) {
            const d = todosLosAddons.find(a => a.id === id);
            irA('publicar');
            document.getElementById('edit-id').value = d.id;
            document.getElementById('add-title').value = d.titulo;
            document.getElementById('add-desc').value = d.descripcion;
            document.getElementById('add-link').value = d.link;
        }

        // PUBLICACIÓN OPTIMIZADA (JAZMÍN, ESTO ARREGLA LO DE LA FOTO)
        function publicarAddon() {
            const id = document.getElementById('edit-id').value;
            const imgFile = document.getElementById('add-image').files[0];
            const data = {
                titulo: document.getElementById('add-title').value,
                descripcion: document.getElementById('add-desc').value,
                link: document.getElementById('add-link').value,
                fecha: Date.now(),
                autor: auth.currentUser.displayName || "Miner"
            };

            if(imgFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 400; canvas.height = 250;
                        canvas.getContext('2d').drawImage(img, 0, 0, 400, 250);
                        data.foto = canvas.toDataURL('image/jpeg', 0.6);
                        id ? db.collection("addons").doc(id).update(data) : db.collection("addons").add(data);
                        location.reload();
                    };
                };
                reader.readAsDataURL(imgFile);
            } else if(id) {
                db.collection("addons").doc(id).update(data).then(() => location.reload());
            }
        }

        // AUTH Y COMENTARIOS
        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
        function registroConEmail() { auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
        function cerrarSesion() { auth.signOut().then(() => location.reload()); }

        function verDetalle(d) {
            addonActualId = d.id;
            document.getElementById('modal-title').innerText = d.titulo;
            document.getElementById('modal-desc').innerText = d.descripcion;
            document.getElementById('modal-img').src = d.foto;
            document.getElementById('modal-link').href = d.link;
            document.getElementById('modal-detalle').classList.remove('hidden');
            document.getElementById('comentar-form').classList.toggle('hidden', !auth.currentUser);
            cargarComentarios(d.id);
        }

        function cargarComentarios(id) {
            db.collection("addons").doc(id).collection("comentarios").orderBy("fecha", "desc").onSnapshot(snap => {
                const lista = document.getElementById('lista-comentarios');
                lista.innerHTML = "";
                snap.forEach(doc => {
                    const c = doc.data();
                    lista.innerHTML += `<div class="bg-white/5 p-2 rounded-xl text-[10px] flex items-center gap-2">
                        <img src="${c.avatar}" class="w-6 h-6 rounded-full">${c.texto}</div>`;
                });
            });
        }
    </script>
</body>
</html>
