<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Ender Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #0b0b0b); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        
        /* MENU LATERAL: Z-index muy alto para estar encima de todo */
        .menu-lateral { transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); position: fixed; top: 0; left: 0; height: 100%; width: 280px; z-index: 500; }
        .menu-lateral.active { transform: translateX(0); }
        
        .addon-card { transition: all 0.3s ease; cursor: pointer; }
        .addon-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.07); border-color: #3b82f6; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); transition: 0.2s; }
        
        /* OVERLAY: Encima de la pagina pero debajo del menu */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Contenedor de cabecera fijo */
        .header-fix { position: sticky; top: 0; z-index: 100; background: #0b0b0b; width: 100%; }
    </style>
</head>
<body class="max-w-lg mx-auto pb-24">

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="modal-detalle" class="fixed inset-0 z-[600] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-md">
        <div class="liquid-glass w-full max-w-sm p-6 relative">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-2xl hover:text-red-500">✕</button>
            <img id="modal-img" src="" class="w-full h-52 object-cover rounded-2xl mb-4 border border-white/10">
            <div id="modal-tag" class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 text-[10px] font-bold mb-2 uppercase"></div>
            <h2 id="modal-title" class="text-2xl font-black italic uppercase mb-2"></h2>
            <p id="modal-desc" class="text-sm text-gray-400 bg-white/5 p-4 rounded-xl mb-4 max-h-32 overflow-y-auto"></p>
            <div class="flex justify-between text-[10px] text-gray-500 italic">
                <span id="modal-fecha"></span>
                <span id="modal-autor"></span>
            </div>
            <a id="modal-link" href="#" target="_blank" class="btn-primary block w-full py-4 rounded-2xl font-black text-center mt-4 uppercase">Descargar</a>
        </div>
    </div>

    <div id="sidebar" class="liquid-glass menu-lateral p-6 m-2 shadow-2xl overflow-y-auto">
        <h2 class="font-black text-blue-400 text-3xl italic mb-6">MC ENDER</h2>
        <nav class="space-y-3">
            <button onclick="irA('inicio')" class="w-full text-left p-4 rounded-2xl bg-white/5 hover:bg-white/10 font-bold">🏠 Inicio</button>
            <button id="btn-menu-publicar" onclick="irA('publicar')" class="hidden w-full text-left p-4 rounded-2xl bg-white/5 border border-blue-500/20 font-bold">🚀 Publicar Addon</button>
            <hr class="border-white/10 my-4">
            <div id="auth-container">
                <div id="inputs-auth" class="space-y-2 mb-4">
                    <input type="email" id="auth-email" placeholder="Correo" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm">
                    <input type="password" id="auth-pass" placeholder="Contraseña" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none text-sm">
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button onclick="loginConEmail()" class="p-3 rounded-xl bg-blue-600/20 text-[10px] uppercase font-bold">Entrar</button>
                        <button onclick="registroConEmail()" class="p-3 rounded-xl bg-white/5 text-[10px] uppercase font-bold">Registro</button>
                    </div>
                </div>
                <button onclick="iniciarSesionGoogle()" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 text-sm font-bold mb-2">🔵 Google Login</button>
                <button id="btn-logout" onclick="cerrarSesion()" class="hidden w-full p-4 rounded-2xl bg-red-600/10 text-red-400 font-bold">🚪 Cerrar Sesión</button>
            </div>
        </nav>
    </div>

    <div class="header-fix">
        <header class="p-4 flex items-center justify-between">
            <button onclick="toggleMenu()" class="liquid-glass p-3 px-5 text-xl relative z-[110] active:scale-90 transition">☰</button>
            <div class="text-right">
                <h1 class="text-xl font-black text-blue-400 italic">MC ENDER</h1>
                <p class="text-[7px] text-gray-500 font-bold uppercase">Official Website</p>
            </div>
        </header>
        
        <div class="px-4 pb-2">
            <div class="relative">
                <input type="text" id="busqueda" oninput="buscarAddons()" placeholder="Buscar addons..." class="w-full bg-white/5 p-4 pl-12 rounded-2xl border border-white/10 outline-none focus:border-blue-500/50 text-sm">
                <span class="absolute left-4 top-4">🔍</span>
            </div>
        </div>

        <div id="filtros-container" class="flex gap-2 px-4 py-3 overflow-x-auto no-scrollbar border-b border-white/5">
            <button onclick="ordenar('recientes')" class="flex-none px-4 py-2 rounded-xl bg-blue-600/20 border border-blue-500/30 text-[10px] font-black uppercase">✨ Recientes</button>
            <button onclick="ordenar('populares')" class="flex-none px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase">🔥 Populares</button>
            <button onclick="ordenar('antiguos')" class="flex-none px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase">⏳ Antiguos</button>
        </div>
    </div>

    <main class="p-4 relative z-10">
        <div id="seccion-inicio">
            <div id="lista-addons" class="space-y-4">
                </div>
        </div>

        <div id="seccion-publicar" class="hidden">
            <div class="liquid-glass p-6">
                <h2 class="text-xl font-black mb-6 text-blue-400 italic text-center uppercase">Subir Contenido</h2>
                <form onsubmit="event.preventDefault(); publicarAddon();" class="space-y-4">
                    <input type="text" id="add-title" placeholder="Nombre" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <select id="add-category" class="w-full bg-[#1a1a2e] p-4 rounded-2xl border border-white/10 outline-none text-gray-400">
                        <option value="Addon">Tipo: Addon</option>
                        <option value="Texture">Tipo: Textura</option>
                        <option value="Map">Tipo: Mapa</option>
                    </select>
                    <textarea id="add-desc" placeholder="Descripción..." class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 h-24 outline-none" required></textarea>
                    <input type="text" id="add-link" placeholder="Link de descarga" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none" required>
                    <input type="file" id="add-image" accept="image/*" class="w-full text-xs text-gray-500" required>
                    <button type="submit" id="btn-subir" class="btn-primary w-full py-4 rounded-2xl font-black">PUBLICAR AHORA</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYmWjewoq8OB94YrZ7UMnGwO4YcXRwg3Y",
            authDomain: "addonverse-78e65.firebaseapp.com",
            projectId: "addonverse-78e65",
            storageBucket: "addonverse-78e65.firebasestorage.app",
            messagingSenderId: "177601088346",
            appId: "1:177601088346:web:716d4c56d08fc90f54c163"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let todosLosAddons = [];
        let esAdmin = false;

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function irA(s) {
            document.getElementById('seccion-inicio').classList.toggle('hidden', s !== 'inicio');
            document.getElementById('seccion-publicar').classList.toggle('hidden', s !== 'publicar');
            document.getElementById('filtros-container').classList.toggle('hidden', s !== 'inicio');
            if(document.getElementById('sidebar').classList.contains('active')) toggleMenu();
        }

        function formatearFecha(ts) {
            if(!ts) return "Reciente";
            const f = new Date(ts);
            return f.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
        }

        auth.onAuthStateChanged(user => {
            const logueado = !!user;
            document.getElementById('btn-menu-publicar').classList.toggle('hidden', !logueado);
            document.getElementById('btn-logout').classList.toggle('hidden', !logueado);
            document.getElementById('inputs-auth').classList.toggle('hidden', logueado);
            if(user) {
                db.collection("usuarios").doc(user.uid).get().then(doc => {
                    esAdmin = doc.exists && doc.data().rol === "admin";
                    mostrarAddons(todosLosAddons);
                });
            }
        });

        db.collection("addons").orderBy("fecha", "desc").onSnapshot(s => {
            todosLosAddons = s.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            mostrarAddons(todosLosAddons);
        });

        function mostrarAddons(lista) {
            const cont = document.getElementById('lista-addons');
            cont.innerHTML = "";
            lista.forEach(d => {
                const card = document.createElement('div');
                card.className = "liquid-glass p-3 flex gap-4 items-center addon-card border border-white/5";
                card.onclick = () => verDetalle(d);
                card.innerHTML = `
                    <img src="${d.foto}" class="w-20 h-20 rounded-xl object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <span class="text-[8px] text-blue-400 font-bold uppercase">${d.categoria}</span>
                            <span class="text-[9px] text-gray-500">🔥 ${d.descargas || 0}</span>
                        </div>
                        <h3 class="text-lg font-black italic uppercase leading-tight">${d.titulo}</h3>
                        <div class="flex justify-between text-[7px] text-gray-500 uppercase mt-1">
                            <span>By: ${d.autor}</span>
                            <span>${formatearFecha(d.fecha)}</span>
                        </div>
                    </div>
                `;
                cont.appendChild(card);
            });
        }

        function verDetalle(d) {
            document.getElementById('modal-title').innerText = d.titulo;
            document.getElementById('modal-desc').innerText = d.descripcion;
            document.getElementById('modal-img').src = d.foto;
            document.getElementById('modal-tag').innerText = d.categoria;
            document.getElementById('modal-fecha').innerText = formatearFecha(d.fecha);
            document.getElementById('modal-autor').innerText = "By: " + d.autor;
            document.getElementById('modal-link').href = d.link;
            document.getElementById('modal-link').onclick = () => {
                db.collection("addons").doc(d.id).update({ descargas: firebase.firestore.FieldValue.increment(1) });
            };
            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modal-detalle').classList.add('hidden'); }

        function ordenar(modo) {
            let copia = [...todosLosAddons];
            if(modo === 'recientes') copia.sort((a,b) => b.fecha - a.fecha);
            if(modo === 'antiguos') copia.sort((a,b) => a.fecha - b.fecha);
            if(modo === 'populares') copia.sort((a,b) => (b.descargas || 0) - (a.descargas || 0));
            mostrarAddons(copia);
        }

        function publicarAddon() {
            const f = document.getElementById('add-image').files[0];
            if(!f) return alert("Sube imagen");
            const r = new FileReader();
            r.onload = (e) => {
                db.collection("addons").add({
                    titulo: document.getElementById('add-title').value,
                    descripcion: document.getElementById('add-desc').value,
                    link: document.getElementById('add-link').value,
                    categoria: document.getElementById('add-category').value,
                    foto: e.target.result,
                    fecha: Date.now(),
                    descargas: 0,
                    autor: auth.currentUser ? auth.currentUser.displayName || "Miner" : "Miner"
                }).then(() => { alert("Publicado!"); irA('inicio'); });
            };
            r.readAsDataURL(f);
        }

        function buscarAddons() {
            const val = document.getElementById('busqueda').value.toLowerCase();
            mostrarAddons(todosLosAddons.filter(a => a.titulo.toLowerCase().includes(val)));
        }

        function iniciarSesionGoogle() { auth.signInWithPopup(provider); }
        function cerrarSesion() { auth.signOut().then(() => location.reload()); }
        function loginConEmail() { auth.signInWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
        function registroConEmail() { auth.createUserWithEmailAndPassword(document.getElementById('auth-email').value, document.getElementById('auth-pass').value); }
    </script>
</body>
</html>
